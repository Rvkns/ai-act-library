<meta property="og:title" content="AI Act Codex — Guida pratica al Regolamento UE sull'IA">
<meta property="og:description" content="Classifica il rischio del tuo sistema IA, consulta obblighi per ruolo e testo del Regolamento, in italiano e inglese.">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg-page: #eaecf0;
  --bg-card: #ffffff;
  --bg-card-alt: #f8fafc;
  --border-card: rgba(0, 0, 0, 0.08);
  --border-card-strong: rgba(0, 0, 0, 0.16);

  --ink: #0f172a;
  --ink-heading: #0f172a;
  --ink-soft: #475569;
  --ink-faint: #94a3b8;
  --rule: rgba(0, 0, 0, 0.08);
  --rule-strong: rgba(0, 0, 0, 0.16);

  --brand-orange: #C35C3B;
  --brand-orange-light: #D97D5E;
  --brand-orange-dark: #A64B2E;

  --brand-dark: #333C44;
  --brand-dark-light: #454F59;
  --brand-dark-soft: #F4F5F6;

  --rubric: #C35C3B;
  --rubric-soft: #D97D5E;
  --paper: #eaecf0;
  --paper-2: #e2e8f0;
  --card: #ffffff;
  --amber: #F97316;
  --green: #10B981;
  --indigo: #6366F1;

  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  --shadow-glow: 0 10px 25px -5px rgba(195, 92, 59, 0.25);
  --radius-card: 2.5rem;
  --radius-lg: 1.25rem;
  --radius-md: 0.75rem;
  --radius-sm: 0.5rem;
  --radius-full: 9999px;
  --radius: 0.75rem;
  --maxw: 1180px;

  --logo-stem: #333C44;
}

html.dark {
  --bg-page: #0f1215;
  --bg-card: #181E24;
  --bg-card-alt: #101417;
  --border-card: rgba(255, 255, 255, 0.08);
  --border-card-strong: rgba(255, 255, 255, 0.18);
  
  --paper: #0f1215;
  --paper-2: #1e293b;
  --card: #181E24;
  --ink: #FFFFFF;
  --ink-heading: #FFFFFF;
  --ink-soft: #CBD5E1;
  --ink-faint: #94A3B8;
  --rule: rgba(255, 255, 255, 0.08);
  --rule-strong: rgba(255, 255, 255, 0.18);
  
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);

  --logo-stem: #CBD5E1;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg-page);
  color: var(--ink);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* Inceptio Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-page); }
::-webkit-scrollbar-thumb { background: var(--brand-orange); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--brand-orange-dark); }

.display { font-family: 'Inter', sans-serif; font-weight: 800; }
.mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; }

a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* Inceptio Radial Glow */
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: 
    radial-gradient(620px 380px at 50% 0%, rgba(195, 92, 59, 0.12), transparent 65%),
    radial-gradient(500px 300px at 90% 80%, rgba(69, 79, 89, 0.12), transparent 70%);
}

/* Header & Floating Topbar */
header.topbar {
  position: sticky; top: 16px; z-index: 40;
  max-width: var(--maxw); margin: 16px auto 0;
  padding: 0 16px;
}

.topbar-inner {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-lg);
  box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
  padding: 12px 20px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  transition: background-color 0.3s ease, border-color 0.3s ease;
}
html.dark .topbar-inner {
  background: rgba(24, 30, 36, 0.85);
  box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
}

.brand { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
.brand-logo-wrap { display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.brand-logo-img { height: 32px !important; max-height: 32px !important; width: auto !important; display: block; object-fit: contain; }

.brand-title {
  font-family: 'Inter', sans-serif; 
  font-weight: 800; font-size: 19px; 
  letter-spacing: -0.02em; color: var(--ink-heading);
}
.brand-sub {
  font-size: 11px; color: var(--brand-orange); 
  font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0.04em;
}

/* Search bar */
.searchwrap {
  flex: 1 1 200px; min-width: 170px; max-width: 380px; position: relative;
}
.searchwrap input {
  width: 100%; padding: 9px 16px 9px 40px; 
  border: 1px solid var(--border-card); border-radius: var(--radius-full);
  background: rgba(0, 0, 0, 0.03); font-size: 13.5px; color: var(--ink); 
  font-family: 'Inter', sans-serif; font-weight: 500;
  transition: all 0.2s ease;
}
html.dark .searchwrap input {
  background: rgba(255, 255, 255, 0.05);
}
.searchwrap input:focus {
  outline: none; border-color: var(--brand-orange);
  box-shadow: 0 0 0 3px rgba(195, 92, 59, 0.15);
}
.searchwrap svg {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--ink-faint);
}

.langtoggle {
  display: flex; background: rgba(0,0,0,0.04); padding: 3px; border-radius: var(--radius-full); gap: 2px;
}
html.dark .langtoggle { background: rgba(255,255,255,0.06); }
.langtoggle button {
  padding: 6px 14px; border: none; background: transparent; color: var(--ink-soft); cursor: pointer;
  font-size: 12px; font-weight: 600; border-radius: var(--radius-full); transition: all 0.2s ease;
  font-family: 'Inter', sans-serif;
}
.langtoggle button.active {
  background: var(--brand-orange); color: #ffffff; box-shadow: 0 2px 8px rgba(195, 92, 59, 0.3);
}

/* Theme Toggle Button */
.theme-btn {
  width: 36px; height: 36px; border-radius: var(--radius-full); border: 1px solid var(--border-card);
  background: rgba(0,0,0,0.03); cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease; font-size: 16px; flex: 0 0 auto;
}
html.dark .theme-btn { background: rgba(255,255,255,0.06); }
.theme-btn:hover { border-color: var(--brand-orange); transform: scale(1.05); }

/* Inceptio Shell & Sidebar */
.shell {
  max-width: var(--maxw); margin: 24px auto 60px; display: flex; gap: 32px; padding: 0 16px; position: relative; z-index: 1;
}

nav.sidebar {
  width: 240px; flex: 0 0 240px; position: sticky; top: 90px; align-self: flex-start;
  max-height: calc(100vh - 110px); overflow-y: auto; padding-right: 8px; padding-top: 8px;
}
nav.sidebar::-webkit-scrollbar { width: 4px; }
nav.sidebar::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
.side-group { margin-bottom: 24px; }
.side-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--brand-orange); margin: 0 0 10px 4px; font-family: 'Inter', sans-serif;
}
.side-link {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-md);
  font-size: 13.5px; font-weight: 500; color: var(--ink-soft); transition: all 0.2s ease; text-decoration: none;
}
.side-link:hover { background: rgba(195, 92, 59, 0.08); color: var(--brand-orange); }
.side-link.active-lib { background: var(--brand-orange) !important; color: #ffffff !important; font-weight: 600; }
.side-link .n { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.8; width: 20px; flex: 0 0 auto; }

main { flex: 1 1 auto; min-width: 0; }

/* Hero */
.hero { padding: 28px 0 36px; border-bottom: 1px solid var(--rule); margin-bottom: 36px; }
.hero-eyebrow {
  font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.08em;
  color: var(--brand-orange); text-transform: uppercase; margin-bottom: 12px; display: flex; gap: 8px; align-items: center;
}
.hero-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.hero h1 {
  font-family: 'Inter', sans-serif; font-weight: 800; font-size: clamp(30px, 4vw, 44px);
  line-height: 1.1; letter-spacing: -0.03em; color: var(--ink-heading); margin: 0 0 16px;
}
.hero p.lede { color: var(--ink-soft); font-size: 16px; line-height: 1.6; margin: 0 0 20px; max-width: 720px; }
.hero-meta { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: var(--ink-faint); font-family: 'JetBrains Mono', monospace; }
.hero-meta b { color: var(--ink-heading); }

/* Section block */
section.block { margin-bottom: 56px; scroll-margin-top: 90px; }
.block-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
.block-num {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--brand-orange);
  background: rgba(195, 92, 59, 0.1); border: 1px solid rgba(195, 92, 59, 0.2); padding: 3px 8px; border-radius: var(--radius-sm); flex: 0 0 auto;
}
.block-head h2 { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink-heading); margin: 0; flex: 0 0 auto; }
.block-head .range { font-size: 12px; color: var(--ink-faint); font-family: 'JetBrains Mono', monospace; }
.block-desc { color: var(--ink-soft); font-size: 14px; max-width: 760px; margin: -8px 0 22px; }

/* Risk Tiers */
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.tier-card {
  background: var(--bg-card); border: 1px solid var(--border-card);
  border-radius: var(--radius-lg); padding: 20px; border-top: 4px solid var(--c);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.tier-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-xl); }
.tier-card .tn { font-size: 11px; font-weight: 700; color: var(--c); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; font-family: 'Inter', sans-serif; }
.tier-card h3 { font-size: 17px; font-weight: 700; color: var(--ink-heading); margin: 0 0 8px; font-family: 'Inter', sans-serif; }
.tier-card p { font-size: 13px; color: var(--ink-soft); margin: 0; line-height: 1.5; }
.gpai-note { margin-top: 16px; background: var(--bg-card-alt); border: 1px dashed var(--indigo); border-radius: var(--radius-md); padding: 16px; font-size: 13.5px; color: var(--ink-soft); }
.gpai-note b { color: var(--indigo); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }

/* Timeline */
.timeline { position: relative; padding-left: 28px; }
.timeline::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--rule); }
.t-item { position: relative; padding-bottom: 22px; }
.t-item:last-child { padding-bottom: 0; }
.t-item::before {
  content: ""; position: absolute; left: -28px; top: 4px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--bg-page); border: 2px solid var(--ink-faint);
}
.t-item.past::before { border-color: var(--green); background: var(--green); }
.t-item.future::before { border-color: var(--brand-orange); }
.t-item .td { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-faint); margin-bottom: 2px; }
.t-item.past .td { color: var(--green); font-weight: 600; }
.t-item.future .td { color: var(--brand-orange); font-weight: 600; }
.t-item .tx { font-size: 14px; color: var(--ink); }
.t-today {
  position: relative; padding: 12px 18px; margin: 8px 0 24px -14px;
  background: var(--brand-orange); color: #ffffff; border-radius: var(--radius-md);
  font-weight: 600; font-size: 13px; box-shadow: var(--shadow-glow);
}

/* Penalties */
.pen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 16px; }
.pen-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-lg); padding: 20px; position: relative; }
.pen-card .pt { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 800; color: var(--brand-orange); line-height: 1; margin-bottom: 10px; letter-spacing: -0.02em; }
.pen-card .pa { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 6px; color: var(--ink-heading); }
.pen-card .pd { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.pen-card .po { font-size: 11.5px; color: var(--ink-faint); }
.pen-notes { font-size: 13px; color: var(--ink-soft); background: var(--bg-card-alt); border-left: 4px solid var(--brand-orange); padding: 12px 16px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.pen-notes div { margin-bottom: 4px; }
.pen-notes div:last-child { margin-bottom: 0; }

/* Roles Tabs */
.role-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.role-tab {
  padding: 8px 16px; border: 1px solid var(--border-card); background: var(--bg-card);
  border-radius: var(--radius-full); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-soft);
  transition: all 0.2s ease;
}
.role-tab.active { background: var(--brand-orange); color: #ffffff; border-color: var(--brand-orange); box-shadow: var(--shadow-glow); }
.role-panel { display: none; }
.role-panel.active { display: block; }
.role-panel h4 { font-family: 'Inter', sans-serif; font-size: 19px; font-weight: 800; margin: 0 0 6px; color: var(--ink-heading); }
.role-panel .rd { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 20px; max-width: 680px; }
.role-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px 24px; }
.role-list li { font-size: 13.5px; padding: 10px 0 10px 22px; border-bottom: 1px solid var(--rule); position: relative; }
.role-list li::before { content: "—"; position: absolute; left: 0; color: var(--brand-orange); font-weight: 700; }

/* Classification Box */
.classify-box { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-lg); padding: 28px; max-width: 720px; box-shadow: var(--shadow-xl); }
.classify-step .cq { font-family: 'Inter', sans-serif; font-size: 19px; font-weight: 700; color: var(--ink-heading); margin: 0 0 20px; line-height: 1.4; }
.classify-step .co { font-size: 11px; font-family: 'Inter', sans-serif; font-weight: 700; color: var(--brand-orange); margin-bottom: 8px; letter-spacing: 0.08em; text-transform: uppercase; }
.classify-answers { display: flex; gap: 12px; flex-wrap: wrap; }
.classify-answers button {
  padding: 10px 22px; border: 2px solid var(--border-card-strong); background: transparent; border-radius: var(--radius-full); cursor: pointer;
  font-size: 14px; font-weight: 700; color: var(--ink-heading); transition: all 0.2s ease;
}
.classify-answers button:hover { background: var(--brand-orange); color: #ffffff; border-color: var(--brand-orange); }
.classify-result { display: none; }
.classify-result.show { display: block; }
.cr-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 12px; border-radius: var(--radius-full); color: #fff; margin-bottom: 16px; }
.classify-result h3 { font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 800; color: var(--ink-heading); margin: 0 0 10px; }
.classify-result p { font-size: 14px; color: var(--ink-soft); margin: 0 0 18px; line-height: 1.6; }
.classify-restart { background: none; border: 1px solid var(--border-card-strong); padding: 8px 18px; border-radius: var(--radius-full); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-soft); transition: all 0.2s ease; }
.classify-restart:hover { border-color: var(--brand-orange); color: var(--brand-orange); }

/* Chapters & Codex */
.filterbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
.chip { padding: 6px 14px; border: 1px solid var(--border-card); border-radius: var(--radius-full); background: var(--bg-card); font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink-soft); transition: all 0.2s ease; }
.chip.active { background: var(--brand-orange); color: #ffffff; border-color: var(--brand-orange); box-shadow: var(--shadow-glow); }

.chapter { margin-bottom: 48px; scroll-margin-top: 90px; }
.chapter-head { display: flex; gap: 16px; align-items: baseline; margin-bottom: 18px; }
.chapter-num { font-family: 'Inter', sans-serif; font-size: 36px; font-weight: 800; color: var(--ink-faint); line-height: 1; opacity: 0.5; flex: 0 0 auto; }
.chapter-title h3 { font-family: 'Inter', sans-serif; font-size: 19px; font-weight: 800; color: var(--ink-heading); margin: 0 0 4px; }
.chapter-title .range { font-size: 12px; color: var(--ink-faint); font-family: 'JetBrains Mono', monospace; }

.articles { display: flex; flex-direction: column; gap: 12px; }
.art-card { display: flex; gap: 18px; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-md); padding: 18px 20px; transition: border-color 0.2s ease; }
.art-card:hover { border-color: rgba(195, 92, 59, 0.4); }
.art-num { flex: 0 0 56px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; color: var(--brand-orange); padding-top: 2px; }
.art-body { flex: 1 1 auto; min-width: 0; }
.art-title { font-weight: 700; font-size: 15px; color: var(--ink-heading); margin-bottom: 6px; }
.art-summary { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 10px; line-height: 1.5; }
.art-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 8px; border-radius: var(--radius-full); background: var(--bg-card-alt); color: var(--ink-soft); border: 1px solid var(--border-card); }
.art-card.hide { display: none; }
mark { background: rgba(195, 92, 59, 0.25); color: inherit; padding: 0 2px; border-radius: 2px; }

/* Annexes */
.annex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.annex-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-md); padding: 18px 20px; display: flex; gap: 16px; }
.annex-num { font-family: 'Inter', sans-serif; color: var(--brand-orange); font-weight: 800; font-size: 18px; flex: 0 0 auto; }
.annex-t { font-weight: 700; font-size: 14px; color: var(--ink-heading); margin-bottom: 4px; }
.annex-d { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }

/* Scenarios */
.scenario-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.scenario-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-md); padding: 20px; }
.scenario-card h4 { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; color: var(--ink-heading); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
.scenario-card h4 .sicon { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-orange); flex: 0 0 auto; }
.scenario-card p { font-size: 13.5px; color: var(--ink-soft); margin: 0; line-height: 1.6; }

/* Library Reader View */
.lib-doc-head { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
.lib-doc-num { font-size: 13px; font-weight: 700; color: var(--brand-orange); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.lib-doc-title { font-size: 26px; font-weight: 800; color: var(--ink-heading); margin: 0; line-height: 1.3; letter-spacing: -0.02em; }
.lib-breadcrumb { font-size: 11.5px; font-weight: 600; color: var(--ink-faint); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.06em; }
.lib-doc-body { font-size: 15px; line-height: 1.7; color: var(--ink); overflow-x: auto; }
.lib-doc-body p.oj-normal { margin: 0 0 12px; }
.lib-doc-body table { border-collapse: collapse; width: 100%; margin: 0 0 16px; }
.lib-doc-body table td { vertical-align: top; padding: 4px 8px; }
.lib-doc-body table:not(.oj-table) td:first-child { width: 36px; padding-right: 8px; color: var(--brand-orange); font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; }
.lib-doc-body table.oj-table { width: 100%; border-collapse: collapse; margin: 12px 0 20px; border: 1px solid var(--border-card); }

   {num:'20', en_t:'Corrective actions and duty to inform', it_t:'Azioni correttive e obbligo di informazione', tags:['provider'],
    en_s:'On identifying non-conformity, providers must immediately act or withdraw/recall the system, and inform distributors, deployers, representatives and importers.',
    it_s:'Rilevata una non conformità, i fornitori devono agire immediatamente o ritirare/richiamare il sistema, informando distributori, deployer, rappresentanti e importatori.'},
   {num:'21', en_t:'Cooperation with authorities', it_t:'Cooperazione con le autorità', tags:['provider'],
    en_s:'Providers must supply, on reasoned request, all information needed to demonstrate conformity, in an official EU language.',
    it_s:'I fornitori devono fornire, su richiesta motivata, tutte le informazioni necessarie a dimostrare la conformità, in una lingua ufficiale UE.'},
   {num:'22', en_t:'Authorised representatives', it_t:'Rappresentanti autorizzati', tags:['provider'],
    en_s:'Non-EU providers must appoint, by written mandate, an EU-established authorised representative before market placement.',
    it_s:'I fornitori extra-UE devono nominare, con mandato scritto, un rappresentante autorizzato stabilito nell\u2019UE prima dell\u2019immissione sul mercato.'},
   {num:'23', en_t:'Importer obligations', it_t:'Obblighi dell\u2019importatore', tags:['importer'],
    en_s:'Before market placement, importers must verify conformity assessment, technical documentation, CE marking and representative appointment.',
    it_s:'Prima dell\u2019immissione sul mercato, gli importatori devono verificare valutazione di conformità, documentazione tecnica, marcatura CE e nomina del rappresentante.'},
   {num:'24', en_t:'Distributor obligations', it_t:'Obblighi del distributore', tags:['distributor'],
    en_s:'Before making a system available, distributors must verify CE marking and documentation, and act if it appears non-conforming.',
    it_s:'Prima di mettere a disposizione un sistema, i distributori devono verificare marcatura CE e documentazione, e intervenire se appare non conforme.'},
   {num:'25', en_t:'Responsibilities along the value chain', it_t:'Responsabilità lungo la catena del valore', tags:['provider','deployer'],
    en_s:'A distributor, importer, deployer or third party becomes a provider — with full obligations — if it rebrands, substantially modifies, or repurposes a system into a high-risk one.',
    it_s:'Un distributore, importatore, deployer o terzo diventa fornitore — con tutti gli obblighi — se rimarchia, modifica sostanzialmente o cambia la destinazione d\u2019uso rendendo il sistema ad alto rischio.'},
   {num:'26', en_t:'Deployer obligations', it_t:'Obblighi del deployer', tags:['deployer'],
    en_s:'Use per instructions; assign competent human oversight; control input-data relevance; monitor and suspend on risk; keep logs (\u22656 months); inform workers and affected individuals; cooperate with authorities.',
    it_s:'Uso secondo le istruzioni; sorveglianza umana competente; controllo della pertinenza dei dati di input; monitoraggio e sospensione in caso di rischio; conservazione dei log (\u22656 mesi); informazione a lavoratori e persone interessate; cooperazione con le autorità.'},
   {num:'27', en_t:'Fundamental Rights Impact Assessment', it_t:'Valutazione d\u2019impatto sui diritti fondamentali', tags:['deployer'],
    en_s:'Required before deployment for public bodies, private entities providing public services, and deployers of Annex III credit-scoring/insurance systems; may complement a GDPR DPIA.',
    it_s:'Richiesta prima dell\u2019uso per enti pubblici, soggetti privati che erogano servizi pubblici, e deployer di sistemi di credit scoring/assicurazione dell\u2019Allegato III; può integrare una DPIA GDPR.'},
   {num:'28\u201339', en_t:'Notified bodies and notifying authorities', it_t:'Organismi notificati e autorità di notifica', tags:['governance'],
    en_s:'Establishes the framework for Member States to designate and supervise the independent bodies that carry out third-party conformity assessment.',
    it_s:'Istituisce il quadro per la designazione e la vigilanza, da parte degli Stati membri, degli organismi indipendenti che effettuano la valutazione di conformità di terze parti.'},
   {num:'40', en_t:'Harmonised standards', it_t:'Norme armonizzate', tags:['provider'],
    en_s:'A system compliant with a harmonised standard cited in the Official Journal is presumed to conform to the corresponding requirements.',
    it_s:'Un sistema conforme a una norma armonizzata pubblicata in Gazzetta Ufficiale si presume conforme ai corrispondenti requisiti.'},
   {num:'41', en_t:'Common specifications', it_t:'Specifiche comuni', tags:['governance'],
    en_s:'The Commission can adopt common specifications as a fallback where harmonised standards are missing or insufficient.',
    it_s:'La Commissione può adottare specifiche comuni come soluzione di riserva in assenza o insufficienza di norme armonizzate.'},
   {num:'42', en_t:'Presumption of conformity', it_t:'Presunzione di conformità', tags:['provider'],
    en_s:'Applies e.g. where a system is trained/tested on data reflecting its specific intended-use setting, and for cybersecurity certified under the Cybersecurity Act.',
    it_s:'Si applica ad es. quando il sistema è addestrato/testato su dati che riflettono il contesto specifico d\u2019uso previsto, e per la cybersicurezza certificata ai sensi del Cybersecurity Act.'},
   {num:'43', en_t:'Conformity assessment', it_t:'Valutazione di conformità', tags:['provider'],
    en_s:'Annex III point 1 (biometrics): notified body required unless harmonised standards are fully applied. Points 2\u20138: internal control only. Annex I products: integrated into the sectoral regime.',
    it_s:'Punto 1 dell\u2019Allegato III (biometria): organismo notificato richiesto salvo piena applicazione delle norme armonizzate. Punti 2\u20138: solo controllo interno. Prodotti dell\u2019Allegato I: integrata nel regime settoriale.'},
   {num:'44', en_t:'Certificates', it_t:'Certificati', tags:['governance'],
    en_s:'Notified bodies issue conformity certificates, valid for a stated period, renewable on reassessment.',
    it_s:'Gli organismi notificati rilasciano certificati di conformità, validi per il periodo indicato, rinnovabili previa nuova valutazione.'},
   {num:'45', en_t:'Information obligations of notified bodies', it_t:'Obblighi informativi degli organismi notificati', tags:['governance'],
    en_s:'Notified bodies must inform authorities and other notified bodies of certificates issued, refused, suspended or withdrawn.',
    it_s:'Gli organismi notificati devono informare le autorità e gli altri organismi notificati di certificati rilasciati, rifiutati, sospesi o revocati.'},
   {num:'46', en_t:'Derogation from conformity assessment', it_t:'Deroga alla valutazione di conformità', tags:['governance'],
    en_s:'A market surveillance authority may exceptionally authorise market placement for reasons of public security or protection of life/health.',
    it_s:'Un\u2019autorità di vigilanza del mercato può autorizzare in via eccezionale l\u2019immissione sul mercato per motivi di sicurezza pubblica o tutela della vita/salute.'},
   {num:'47', en_t:'EU declaration of conformity', it_t:'Dichiarazione di conformità UE', tags:['provider'],
    en_s:'Providers must draw up a written declaration of conformity for each high-risk system and keep it available for 10 years.',
    it_s:'I fornitori devono redigere una dichiarazione di conformità scritta per ciascun sistema ad alto rischio e conservarla per 10 anni.'},
   {num:'48', en_t:'CE marking', it_t:'Marcatura CE', tags:['provider'],
    en_s:'High-risk systems must bear the CE marking, visibly, legibly and indelibly, before market placement.',
    it_s:'I sistemi ad alto rischio devono recare la marcatura CE, in modo visibile, leggibile e indelebile, prima dell\u2019immissione sul mercato.'},
   {num:'49', en_t:'Registration', it_t:'Registrazione', tags:['provider','deployer'],
    en_s:'Providers (and certain public-body deployers) must register high-risk systems in the EU database before market placement/use.',
    it_s:'I fornitori (e alcuni deployer pubblici) devono registrare i sistemi ad alto rischio nella banca dati UE prima dell\u2019immissione sul mercato/uso.'}
  ]},
 {id:'ch4', num:'IV', en:'Transparency Obligations', it:'Obblighi di trasparenza', range:'Art. 50', apply:'2026-08-02',
  articles:[
   {num:'50(1)', en_t:'Disclosure of AI interaction', it_t:'Informazione sull\u2019interazione con l\u2019IA', tags:['provider'],
    en_s:'Providers of systems that interact directly with people (chatbots/voice assistants) must inform users they are interacting with AI, unless obvious.',
    it_s:'I fornitori di sistemi che interagiscono direttamente con le persone (chatbot/assistenti vocali) devono informare gli utenti che stanno interagendo con un\u2019IA, salvo che sia evidente.'},
   {num:'50(2)', en_t:'Marking of synthetic content', it_t:'Marcatura dei contenuti sintetici', tags:['provider'],
    en_s:'Providers of generative AI must mark outputs (audio/image/video/text) in a machine-readable, detectable format. Applies to pre-existing systems from 2 Dec 2026.',
    it_s:'I fornitori di IA generativa devono marcare gli output (audio/immagine/video/testo) in un formato leggibile da macchina e rilevabile. Applicabile ai sistemi preesistenti dal 2 dicembre 2026.'},
   {num:'50(3)', en_t:'Emotion recognition / biometric categorisation notice', it_t:'Informativa su riconoscimento emozioni / categorizzazione biometrica', tags:['deployer'],
    en_s:'Deployers of emotion-recognition or biometric-categorisation systems must inform exposed persons.',
    it_s:'I deployer di sistemi di riconoscimento delle emozioni o categorizzazione biometrica devono informare le persone esposte.'},
   {num:'50(4)', en_t:'Deepfake disclosure', it_t:'Informativa sui deepfake', tags:['deployer'],
    en_s:'Deployers generating/manipulating deepfakes must disclose the content is artificially generated, with carve-outs for artistic/satirical works and, for public-interest text, human-reviewed editorial content.',
    it_s:'I deployer che generano/manipolano deepfake devono dichiarare che il contenuto è generato artificialmente, con eccezioni per opere artistiche/satiriche e, per testi di interesse pubblico, contenuti editoriali con revisione umana.'},
   {num:'50(5)', en_t:'Form of information', it_t:'Forma dell\u2019informazione', tags:['provider','deployer'],
    en_s:'Information must be clear and distinguishable, provided at the latest at the time of first interaction or exposure.',
    it_s:'L\u2019informazione deve essere chiara e distinguibile, fornita al più tardi al momento della prima interazione o esposizione.'}
  ]},
 {id:'ch5', num:'V', en:'General-Purpose AI Models', it:'Modelli di IA per finalità generali', range:'Arts 51\u201356', apply:'2025-08-02',
  articles:[
   {num:'51', en_t:'Classification with systemic risk', it_t:'Classificazione con rischio sistemico', tags:['gpai'],
    en_s:'A GPAI model has systemic risk if it shows high-impact capabilities (via benchmarks) or is designated by the Commission; a presumption applies above 10\u00b2\u2075 FLOP of cumulative training compute.',
    it_s:'Un modello GPAI presenta rischio sistemico se mostra capacità ad alto impatto (tramite benchmark) o è designato dalla Commissione; si presume tale sopra i 10\u00b2\u2075 FLOP di calcolo cumulativo di addestramento.'},
   {num:'52', en_t:'Procedure', it_t:'Procedura', tags:['gpai'],
    en_s:'Sets the notification/designation procedure and the provider\u2019s right to rebut the systemic-risk presumption with evidence.',
    it_s:'Stabilisce la procedura di notifica/designazione e il diritto del fornitore di confutare la presunzione di rischio sistemico con prove.'},
   {num:'53', en_t:'Obligations for all GPAI providers', it_t:'Obblighi per tutti i fornitori GPAI', tags:['gpai'],
    en_s:'Technical documentation (Annex XI); information for downstream providers (Annex XII); a policy to comply with EU copyright law including the text-and-data-mining opt-out; a public summary of training content. Free/open-source non-systemic-risk models are exempt only from the first two.',
    it_s:'Documentazione tecnica (Allegato XI); informazioni per i fornitori a valle (Allegato XII); politica di conformità al diritto d\u2019autore UE incluso l\u2019opt-out per text-and-data-mining; sintesi pubblica dei contenuti di addestramento. I modelli open source gratuiti non a rischio sistemico sono esentati solo dai primi due obblighi.'},
   {num:'54', en_t:'Authorised representatives', it_t:'Rappresentanti autorizzati', tags:['gpai'],
    en_s:'Non-EU GPAI providers must appoint an EU-established authorised representative.',
    it_s:'I fornitori GPAI extra-UE devono nominare un rappresentante autorizzato stabilito nell\u2019UE.'},
   {num:'55', en_t:'Additional obligations — systemic risk', it_t:'Obblighi aggiuntivi — rischio sistemico', tags:['gpai'],
    en_s:'Model evaluation including adversarial testing/red-teaming; assessment and mitigation of systemic risks at Union level; tracking and reporting of serious incidents; adequate cybersecurity.',
    it_s:'Valutazione del modello inclusi test avversariali/red-teaming; valutazione e mitigazione dei rischi sistemici a livello dell\u2019Unione; tracciamento e segnalazione di incidenti gravi; adeguata cybersicurezza.'},
   {num:'56', en_t:'Codes of practice', it_t:'Codici di buone pratiche', tags:['gpai'],
    en_s:'The voluntary GPAI Code of Practice (published July 2025, endorsed by the Commission and AI Board on 1 Aug 2025) helps demonstrate compliance pending harmonised standards.',
    it_s:'Il Codice di buone pratiche GPAI (pubblicato a luglio 2025, approvato da Commissione e AI Board l\u20191 agosto 2025) aiuta a dimostrare la conformità in attesa delle norme armonizzate.'}
  ]},
 {id:'ch6', num:'VI', en:'Measures in Support of Innovation', it:'Misure a sostegno dell\u2019innovazione', range:'Arts 57\u201363', apply:null, note:true,
  articles:[
   {num:'57\u201363', en_t:'Sandboxes, real-world testing, SME support', it_t:'Sandbox, test in condizioni reali, sostegno alle PMI', tags:['governance'],
    en_s:'AI regulatory sandboxes (at least one per Member State, operational by 2 Aug 2027 post-Omnibus), real-world testing outside sandboxes with informed consent, SME/start-up support measures, and derogations for specific operators.',
    it_s:'Sandbox normative per l\u2019IA (almeno una per Stato membro, operative entro il 2 agosto 2027 dopo l\u2019Omnibus), test in condizioni reali fuori sandbox con consenso informato, misure di sostegno per PMI/start-up, e deroghe per operatori specifici.'}
  ]},
 {id:'ch7', num:'VII', en:'Governance', it:'Governance', range:'Arts 64\u201370', apply:'2025-08-02',
  articles:[
   {num:'64', en_t:'AI Office', it_t:'Ufficio per l\u2019IA', tags:['governance'],
    en_s:'A Commission body with a central role supervising GPAI models and coordinating enforcement across Member States.',
    it_s:'Organismo della Commissione con ruolo centrale nella vigilanza sui modelli GPAI e nel coordinamento dell\u2019applicazione tra Stati membri.'},
   {num:'65\u201366', en_t:'European Artificial Intelligence Board', it_t:'Comitato europeo per l\u2019intelligenza artificiale', tags:['governance'],
    en_s:'Made up of Member State representatives; coordinates national authorities and issues opinions and recommendations.',
    it_s:'Composto da rappresentanti degli Stati membri; coordina le autorità nazionali ed emette pareri e raccomandazioni.'},
   {num:'67', en_t:'Advisory Forum', it_t:'Forum consultivo', tags:['governance'],
    en_s:'A stakeholder body (industry, civil society, academia) advising the Board and the Commission.',
    it_s:'Organismo di portatori di interesse (industria, società civile, mondo accademico) che consiglia il Comitato e la Commissione.'},
   {num:'68', en_t:'Scientific Panel of independent experts', it_t:'Gruppo scientifico di esperti indipendenti', tags:['governance'],
    en_s:'Independent experts who can trigger qualified alerts on systemic risks from GPAI models.',
    it_s:'Esperti indipendenti che possono attivare segnalazioni qualificate sui rischi sistemici dei modelli GPAI.'},
   {num:'69', en_t:'Access to the pool of experts', it_t:'Accesso al pool di esperti', tags:['governance'],
    en_s:'Member States may draw on the Scientific Panel\u2019s expertise to support enforcement.',
    it_s:'Gli Stati membri possono avvalersi delle competenze del Gruppo scientifico a supporto dell\u2019applicazione.'},
   {num:'70', en_t:'National competent authorities', it_t:'Autorità nazionali competenti', tags:['governance'],
    en_s:'Each Member State designates notifying authorities and market surveillance authorities, plus a single point of contact.',
    it_s:'Ogni Stato membro designa autorità di notifica e autorità di vigilanza del mercato, oltre a un punto di contatto unico.'}
  ]},
 {id:'ch8', num:'VIII', en:'EU Database', it:'Banca dati UE', range:'Art. 71', apply:null, note:true,
  articles:[
   {num:'71', en_t:'EU database for high-risk AI systems', it_t:'Banca dati UE per i sistemi ad alto rischio', tags:['provider','deployer'],
    en_s:'A public database where providers register Annex III high-risk systems, and public-authority deployers register their use.',
    it_s:'Banca dati pubblica in cui i fornitori registrano i sistemi ad alto rischio dell\u2019Allegato III, e i deployer che sono autorità pubbliche registrano il loro utilizzo.'}
  ]},
 {id:'ch9', num:'IX', en:'Post-Market Monitoring, Information Sharing, Market Surveillance', it:'Sorveglianza post-commercializzazione, condivisione delle informazioni, vigilanza del mercato', range:'Arts 72\u201394', apply:null, note:true,
  articles:[
   {num:'72', en_t:'Post-market monitoring', it_t:'Sorveglianza post-commercializzazione', tags:['provider'],
    en_s:'Providers must actively collect and analyse experience from use of the system to check continued compliance.',
    it_s:'I fornitori devono raccogliere e analizzare attivamente l\u2019esperienza d\u2019uso del sistema per verificarne la conformità continuativa.'},
   {num:'73', en_t:'Reporting of serious incidents', it_t:'Segnalazione di incidenti gravi', tags:['provider'],
    en_s:'Providers must report serious incidents without undue delay — generally within 15 days of establishing a causal link (2 days for widespread infringement/serious risk; 10 days for death).',
    it_s:'I fornitori devono segnalare gli incidenti gravi senza indebito ritardo — in genere entro 15 giorni dall\u2019accertamento del nesso causale (2 giorni per infrazioni diffuse/rischio grave; 10 giorni in caso di decesso).'},
   {num:'74\u201384', en_t:'Market surveillance and enforcement', it_t:'Vigilanza del mercato e applicazione', tags:['governance'],
    en_s:'Sets market-surveillance powers, procedures for risky systems, and the Union safeguard procedure; the 2026 Omnibus adds AI Office powers over GPAI (investigations, inspections, binding commitments, penalty payments up to 5% of average daily worldwide turnover).',
    it_s:'Definisce i poteri di vigilanza del mercato, le procedure per i sistemi rischiosi e la procedura di salvaguardia dell\u2019Unione; l\u2019Omnibus 2026 aggiunge poteri dell\u2019Ufficio per l\u2019IA sui modelli GPAI (indagini, ispezioni, impegni vincolanti, penalità di mora fino al 5% del fatturato mondiale medio giornaliero).'},
   {num:'85', en_t:'Right to lodge a complaint', it_t:'Diritto di presentare un reclamo', tags:['general'],
    en_s:'Any natural or legal person may lodge a complaint with a market surveillance authority regarding non-compliance.',
    it_s:'Ogni persona fisica o giuridica può presentare un reclamo a un\u2019autorità di vigilanza del mercato in caso di non conformità.'},
   {num:'86', en_t:'Right to explanation of individual decisions', it_t:'Diritto a una spiegazione delle decisioni individuali', tags:['general'],
    en_s:'A person subject to a decision based on high-risk system output with legal/significant effects has the right to a clear explanation of the decision.',
    it_s:'Chi è soggetto a una decisione basata sull\u2019output di un sistema ad alto rischio con effetti giuridici/significativi ha diritto a una spiegazione chiara della decisione.'},
   {num:'87', en_t:'Whistleblower protection', it_t:'Protezione degli informatori', tags:['general'],
    en_s:'Reports of AI Act infringements fall under the EU Whistleblower Directive protections.',
    it_s:'Le segnalazioni di violazioni del regolamento IA rientrano nelle tutele della Direttiva UE sul whistleblowing.'},
   {num:'88\u201394', en_t:'GPAI supervision by the AI Office', it_t:'Vigilanza sui modelli GPAI da parte dell\u2019Ufficio per l\u2019IA', tags:['gpai','governance'],
    en_s:'Dedicated powers to monitor GPAI compliance, receive systemic-risk alerts, request documentation/evaluations, and request mitigation measures, subject to operators\u2019 procedural rights.',
    it_s:'Poteri dedicati per monitorare la conformità GPAI, ricevere segnalazioni di rischio sistemico, richiedere documentazione/valutazioni e richiedere misure di mitigazione, nel rispetto dei diritti procedurali degli operatori.'}
  ]},
 {id:'ch10', num:'X', en:'Codes of Conduct and Guidelines', it:'Codici di condotta e orientamenti', range:'Arts 95\u201396', apply:'2024-08-01',
  articles:[
   {num:'95\u201396', en_t:'Voluntary codes and Commission guidelines', it_t:'Codici volontari e orientamenti della Commissione', tags:['general'],
    en_s:'Voluntary codes of conduct are encouraged for non-high-risk systems; the Commission issues implementation guidelines.',
    it_s:'Codici di condotta volontari sono incoraggiati per i sistemi non ad alto rischio; la Commissione emana orientamenti attuativi.'}
  ]},
 {id:'ch11', num:'XI', en:'Delegation and Committee', it:'Delega di potere e comitato', range:'Arts 97\u201398', apply:'2024-08-01',
  articles:[
   {num:'97\u201398', en_t:'Delegated powers and committee procedure', it_t:'Poteri delegati e procedura di comitato', tags:['governance'],
    en_s:'Procedural articles governing the Commission\u2019s power to adopt delegated and implementing acts under the Regulation.',
    it_s:'Articoli procedurali che disciplinano il potere della Commissione di adottare atti delegati e di esecuzione ai sensi del regolamento.'}
  ]},
 {id:'ch12', num:'XII', en:'Penalties', it:'Sanzioni', range:'Arts 99\u2013101', apply:'2025-08-02',
  articles:[
   {num:'99', en_t:'Penalties', it_t:'Sanzioni', tags:['general'],
    en_s:'Three tiers: up to €35M/7% for Art. 5 breaches; up to €15M/3% for most other breaches (incl. high-risk and Art. 50); up to €7.5M/1% for misleading information. SMEs pay the lower of the two figures.',
    it_s:'Tre fasce: fino a 35 M€/7% per violazioni dell\u2019art. 5; fino a 15 M€/3% per la maggior parte delle altre violazioni (incl. alto rischio e art. 50); fino a 7,5 M€/1% per informazioni fuorvianti. Le PMI pagano il valore più basso tra i due.'},
   {num:'100', en_t:'Fines on EU institutions', it_t:'Sanzioni per le istituzioni UE', tags:['governance'],
    en_s:'Fines on Union institutions/bodies, imposed by the EDPS: up to €1.5M (prohibited practices) or €0.75M (other breaches).',
    it_s:'Sanzioni per istituzioni/organi dell\u2019Unione, irrogate dal Garante europeo (EDPS): fino a 1,5 M€ (pratiche vietate) o 0,75 M€ (altre violazioni).'},
   {num:'101', en_t:'Fines for GPAI providers', it_t:'Sanzioni per i fornitori GPAI', tags:['gpai'],
    en_s:'Up to €15M or 3% of worldwide annual turnover, whichever is higher.',
    it_s:'Fino a 15 M€ o al 3% del fatturato mondiale annuo, se superiore.'}
  ]},
 {id:'ch13', num:'XIII', en:'Final Provisions', it:'Disposizioni finali', range:'Arts 102\u2013113', apply:null, note:true,
  articles:[
   {num:'102\u2013110', en_t:'Amendments to sectoral legislation', it_t:'Modifiche alla legislazione settoriale', tags:['governance'],
    en_s:'Integrates AI Act requirements into existing sectoral frameworks (machinery, aviation, motor vehicles, rail, etc.).',
    it_s:'Integra i requisiti del regolamento IA nei quadri settoriali esistenti (macchinari, aviazione, veicoli a motore, ferrovie, ecc.).'},
   {num:'111', en_t:'Transitional provisions', it_t:'Disposizioni transitorie', tags:['general'],
    en_s:'Sets grace periods for AI systems and GPAI models already on the market before the relevant application dates.',
    it_s:'Stabilisce periodi transitori per i sistemi di IA e i modelli GPAI già sul mercato prima delle relative date di applicazione.'},
   {num:'112', en_t:'Evaluation and review', it_t:'Valutazione e riesame', tags:['governance'],
    en_s:'The Commission must periodically evaluate and report on the Regulation\u2019s application, including possible amendments.',
    it_s:'La Commissione deve valutare periodicamente e riferire sull\u2019applicazione del regolamento, comprese eventuali modifiche.'},
   {num:'113', en_t:'Entry into force and application', it_t:'Entrata in vigore e applicazione', tags:['general'],
    en_s:'Sets the phased application dates shown in the Timeline above.',
    it_s:'Stabilisce le date di applicazione scaglionata riportate nella Linea del tempo qui sopra.'}
  ]}
];

function renderSanctionsChart(){
  const max = 35000000;
  const rows = PENALTIES.map(p=>{
    const val = parseInt(p.amount.replace(/[^\d]/g,''),10);
    const widthPct = (val/max*100).toFixed(1);
    const label = state.lang==='it' ? p.n_it : p.n_en;
    const amount = state.lang==='it' ? p.amount : p.amountEn;
    return `<div class="sanc-row">
      <div class="sanc-label">${label}</div>
      <div class="sanc-bar-track"><div class="sanc-bar" style="width:${widthPct}%"></div></div>
      <div class="sanc-amount">${amount} <span class="sanc-pct">/ ${p.pct}</span></div>
    </div>`;
  }).join('');
  return `<div class="sanc-chart">${rows}</div>`;
}

let classifyPath = [CLASSIFY.start];
function renderClassify(){
  const L = UI[state.lang];
  return `
  <section class="block" id="classify">
    <div class="block-head"><span class="block-num">${L.s5}</span><h2>${L.s5t}</h2></div>
    <p class="block-desc">${L.s5d}</p>
    <div class="classify-box" id="classifyBox"></div>
  </section>`;
}
function renderClassifyBox(){
  const box = document.getElementById('classifyBox');
  if(!box) return;
  const lang = state.lang;
  const currentId = classifyPath[classifyPath.length-1];
  if(CLASSIFY.nodes[currentId]){
    const node = CLASSIFY.nodes[currentId];
    const trail = classifyPath.slice(0,-1).map(id=>CLASSIFY.nodes[id]).filter(Boolean);
    box.innerHTML = `
      ${trail.length ? `<div class="classify-trail">${trail.map(n=>'✓').join(' ')} ${lang==='it'?trail.length+' risposta/e registrata/e':trail.length+' answer(s) recorded'}</div>` : ''}
      <div class="classify-step">
        <div class="co">${lang==='it'?node.o_it:node.o_en}</div>
        <p class="cq">${lang==='it'?node.q_it:node.q_en}</p>
        <div class="classify-answers">
          <button data-go="${node.yes}">${lang==='it'?'Sì':'Yes'}</button>
          <button data-go="${node.no}">${lang==='it'?'No':'No'}</button>
        </div>
      </div>`;
    box.querySelectorAll('[data-go]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ classifyPath.push(btn.getAttribute('data-go')); renderClassifyBox(); });
    });
  } else {
    const res = CLASSIFY.results[currentId];
    box.innerHTML = `
      <div class="classify-result show">
        <span class="cr-tag" style="background:${res.color}">${lang==='it'?res.tag_it:res.tag_en}</span>
        <h3>${lang==='it'?res.t_it:res.t_en}</h3>
        <p>${lang==='it'?res.d_it:res.d_en}</p>
        <button class="classify-restart" id="classifyRestart">${UI[lang].restart}</button>
      </div>`;
    document.getElementById('classifyRestart').addEventListener('click', ()=>{
      classifyPath = [CLASSIFY.start]; renderClassifyBox();
    });
  }
}

      document.querySelectorAll('.role-panel').forEach(p=>p.classList.toggle('active', p.getAttribute('data-role-panel')===state.roleTab));

}

function bindFilterChips(){
  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      state.filter = chip.getAttribute('data-filter');
      document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c===chip));
      applySearch();
    });
  });
}

function applySearch(){
  const q = state.guideQuery.trim().toLowerCase();
  const cards = document.querySelectorAll('.art-card');
  let visible = 0;
  cards.forEach(card=>{
    const tags = card.getAttribute('data-tags').split(' ');
    const matchesFilter = state.filter==='all' || tags.includes(state.filter);
    const hay = card.getAttribute('data-search');
    const matchesQuery = !q || hay.includes(q);
    const show = matchesFilter && matchesQuery;
    card.classList.toggle('hide', !show);
    if(show) visible++;
  });
  // hide chapters with zero visible articles when filtering/searching
  document.querySelectorAll('.chapter').forEach(ch=>{
    const anyVisible = Array.from(ch.querySelectorAll('.art-card')).some(c=>!c.classList.contains('hide'));
    ch.classList.toggle('js-hidden', !anyVisible);
  });
  const countEl = document.getElementById('searchCount');
  if(q){
    countEl.textContent = visible + ' ' + UI[state.lang].results;
  } else {
    countEl.textContent = '';
  }
}

/* ============================= LIBRARY ============================= */
function renderLibrarySidebar(){
  const L = UI[state.lang];
  const chapterGroups = CHAPTER_RANGES.map(r=>{
    const chap = CHAPTERS.find(c=>c.id===r.id);
    const isOpenChapter = state.libSection==='articles' && state.libArticle>=r.from && state.libArticle<=r.to;
    const nums = [];
    for(let n=r.from; n<=r.to; n++) nums.push(n);
    const links = nums.map(n=>`<a class="lib-art-link ${isOpenChapter && state.libArticle===n?'active-lib':''}" data-lib-article="${n}" href="#">${n}</a>`).join('');
    return `<details class="lib-chapter" ${isOpenChapter?'open':''}>
      <summary><span class="n">${chap.num}</span> ${state.lang==='it'?chap.it:chap.en}</summary>
      <div class="lib-chapter-arts">${links}</div>
    </details>`;
  }).join('');
  document.getElementById('librarySidebar').innerHTML = `
    <div class="side-group">
      <a class="side-link ${state.libSection==='recitals'?'active-lib':''}" data-lib-section="recitals" href="#">${L.libRecitals}</a>
    </div>
    <div class="side-group">
      <div class="side-label">${L.libArticles}</div>
      ${chapterGroups}
    </div>
    <div class="side-group">
      <a class="side-link ${state.libSection==='annexes'?'active-lib':''}" data-lib-section="annexes" href="#">${L.libAnnexes}</a>
      <a class="side-link ${state.libSection==='omnibus'?'active-lib':''}" data-lib-section="omnibus" href="#">${L.libOmnibus}</a>
    </div>`;
  document.querySelectorAll('#librarySidebar [data-lib-section]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.preventDefault(); state.libSection = el.getAttribute('data-lib-section'); renderLibrary(); });
  });
  document.querySelectorAll('#librarySidebar [data-lib-article]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.preventDefault(); state.libSection='articles'; state.libArticle = parseInt(el.getAttribute('data-lib-article'),10); renderLibrary(); });
  });
}

function renderRecitalsView(){
  const L = UI[state.lang];
  const recitals = LIBRARY_DATA[state.lang].recitals;
  const items = recitals.map(r=>`
    <details class="lib-accordion-item" id="rec-${r.num}">
      <summary>${L.libRecital} ${r.num}</summary>
      <div class="lib-doc-body">${r.html}</div>
    </details>`).join('');
  return `
    <div class="block-head"><span class="block-num">§</span><h2>${L.libRecitals}</h2></div>
    <p class="block-desc">${L.libRecitalsDesc}</p>
    <div class="lib-accordion">${items}</div>`;
}

const OMNIBUS_MODIFIED_ARTICLES = [1, 2, 3, 4, 5, 6, 10, 11, 17, 25, 27, 28, 29, 30, 40, 42, 43, 50, 56, 57, 58, 60, 63, 64, 69, 70, 72, 75, 76, 77, 95, 96, 97, 99, 111, 113];

function openOmnibusArticle(artNum){
  state.libSection = 'omnibus';
  renderLibrary();
  requestAnimationFrame(()=>{
    const target = document.getElementById('omnibus-art-' + (artNum || 1));
    if(target){
      target.open = true;
      target.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
  });
}

function renderArticleView(){
  const L = UI[state.lang];
  const arts = LIBRARY_DATA[state.lang].articles;
  const art = arts.find(a=>a.num===state.libArticle) || arts[0];
  const chap = chapterForArticle(art.num);
  const chapObj = CHAPTERS.find(c=>c.id===chap.id);
  const prevNum = art.num>1 ? art.num-1 : null;
  const nextNum = art.num<113 ? art.num+1 : null;
  
  const isOmnibusModified = OMNIBUS_MODIFIED_ARTICLES.includes(art.num);
  const omnibusBanner = isOmnibusModified ? `
    <div class="omnibus-alert-banner">
      <span class="o-icon">⚠️</span>
      <div class="o-text">
        <strong>${state.lang==='it'?'Modificato dal Digital Omnibus (Regolamento (UE) 2026/1744)':'Amended by the Digital Omnibus (Regulation (EU) 2026/1744)'}</strong>
        <p>${state.lang==='it'
          ?'Questo articolo è soggetto a modifiche, integrazioni o differimenti introdotti dal Digital Omnibus sull’IA.'
          :'This article is subject to amendments, additions or deferrals introduced by the Digital Omnibus on AI.'}</p>
      </div>
      <a href="#" class="o-link" onclick="event.preventDefault(); openOmnibusArticle(1);">${state.lang==='it'?'Vedi Modifica Omnibus →':'View Omnibus Amendment →'}</a>
    </div>` : '';

  return `
    <div class="lib-breadcrumb">${chap.num} — ${state.lang==='it'?chapObj.it:chapObj.en}</div>
    <div class="lib-doc-head">
      <div class="lib-doc-num">${state.lang==='it'?'Articolo':'Article'} ${art.num}</div>
      <h2 class="lib-doc-title">${art.title}</h2>
    </div>
    ${omnibusBanner}
    <div class="lib-doc-body">${art.html}</div>
    <div class="lib-nav-btns">
      <button ${prevNum?'':'disabled'} data-lib-article="${prevNum||''}">${L.libPrev}</button>
      <button ${nextNum?'':'disabled'} data-lib-article="${nextNum||''}">${L.libNext}</button>
    </div>`;
}

function bindLibraryNav(){
  document.querySelectorAll('#libraryMain [data-lib-article]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const n = btn.getAttribute('data-lib-article');
      if(!n) return;
      state.libArticle = parseInt(n,10);
      renderLibrary();
      document.getElementById('libraryMain').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

let libSearchIndex = null;
function stripHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || '';
}
function buildLibSearchIndex(){
  libSearchIndex = {it:[], en:[]};
  ['it','en'].forEach(lang=>{
    const d = LIBRARY_DATA[lang];
    d.articles.forEach(a=>libSearchIndex[lang].push({type:'article', num:a.num, title:a.title, text:(a.title+' '+stripHtml(a.html)).toLowerCase()}));
    d.recitals.forEach(r=>libSearchIndex[lang].push({type:'recital', num:r.num, title:'', text:stripHtml(r.html).toLowerCase()}));
    d.annexes.forEach(a=>libSearchIndex[lang].push({type:'annex', num:a.num, title:a.title, text:(a.title+' '+stripHtml(a.html)).toLowerCase()}));
    // The Digital Omnibus is English-only regardless of UI language, but it
    // must still be findable no matter which language the user has selected.
    OMNIBUS_DATA.en.articles.forEach(a=>libSearchIndex[lang].push({type:'omnibus-article', num:a.num, title:a.title, text:(a.title+' '+stripHtml(a.html)).toLowerCase()}));
    OMNIBUS_DATA.en.recitals.forEach(r=>libSearchIndex[lang].push({type:'omnibus-recital', num:r.num, title:'', text:stripHtml(r.html).toLowerCase()}));
  });
}
function applyLibrarySearch(){
  const panel = document.getElementById('searchResultsPanel');
  const q = state.libQuery.trim().toLowerCase();
  if(!q){ panel.classList.remove('show'); panel.innerHTML=''; document.getElementById('searchCount').textContent=''; return; }
  if(!libSearchIndex) buildLibSearchIndex();
  const matches = libSearchIndex[state.lang].filter(e=>e.text.includes(q)).slice(0,25);
  document.getElementById('searchCount').textContent = matches.length + ' ' + UI[state.lang].results;
  panel.innerHTML = matches.map(m=>{
    const label = m.type==='article' ? `Art. ${m.num} — ${m.title}` :
                  m.type==='recital' ? `${state.lang==='it'?'Considerando':'Recital'} ${m.num}` :
                  m.type==='annex' ? `${state.lang==='it'?'Allegato':'Annex'} ${m.num} — ${m.title}` :
                  m.type==='omnibus-article' ? `Omnibus — Art. ${m.num} — ${m.title}` :
                  `Omnibus — ${state.lang==='it'?'Considerando':'Recital'} ${m.num}`;
    return `<button class="search-result" data-type="${m.type}" data-num="${m.num}">${label}</button>`;
  }).join('');
  panel.classList.toggle('show', matches.length>0);
  panel.querySelectorAll('.search-result').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      openLibraryResult(btn.getAttribute('data-type'), btn.getAttribute('data-num'), state.libQuery.trim());
      panel.classList.remove('show');
    });
  });
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlightTerm(root, term){
  if(!term) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')', 'ig');
  const nodes = [];
  let n; while((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(node=>{
    if(!re.test(node.nodeValue)) return;
    re.lastIndex = 0;
    const escaped = escapeHtml(node.nodeValue);
    const span = document.createElement('span');
    span.innerHTML = escaped.replace(re, '<mark>$1</mark>');
    node.parentNode.replaceChild(span, node);
  });
}
function openLibraryResult(type, num, term){
  if(type==='article'){ state.libSection='articles'; state.libArticle=parseInt(num,10); }
  else if(type==='annex'){ state.libSection='annexes'; }
  else if(type==='recital'){ state.libSection='recitals'; }
  else if(type==='omnibus-article' || type==='omnibus-recital'){ state.libSection='omnibus'; }
  renderLibrary();
  requestAnimationFrame(()=>{
    let target = null;
    if(type==='recital') target = document.getElementById('rec-'+num);
    if(type==='annex') target = document.getElementById('anx-'+num);
    if(type==='omnibus-article') target = document.getElementById('omnibus-art-'+num);
    if(type==='omnibus-recital') target = document.getElementById('omnibus-rec-'+num);
    if(target){ target.open = true; target.scrollIntoView({behavior:'smooth', block:'start'}); }
    if(term) highlightTerm(document.getElementById('libraryMain'), term);
  });
}

function renderAnnexesView(){
  const L = UI[state.lang];
  const annexes = LIBRARY_DATA[state.lang].annexes;
  const items = annexes.map(a=>`
    <details class="lib-accordion-item" id="anx-${a.num}">
      <summary>${state.lang==='it'?'Allegato':'Annex'} ${a.num} — ${a.title}</summary>
      <div class="lib-doc-body">${a.html}</div>
    </details>`).join('');
  return `
    <div class="block-head"><span class="block-num">§</span><h2>${L.libAnnexes}</h2></div>
    <div class="lib-accordion">${items}</div>`;
}

function renderOmnibusView(){
  const L = UI[state.lang];
  const arts = OMNIBUS_DATA.en.articles;
  const recitals = OMNIBUS_DATA.en.recitals;
  const artItems = arts.map(a=>`
    <details class="lib-accordion-item" id="omnibus-art-${a.num}">
      <summary>Article ${a.num} — ${a.title}</summary>
      <div class="lib-doc-body">${a.html}</div>
    </details>`).join('');
  const recItems = recitals.map(r=>`
    <details class="lib-accordion-item" id="omnibus-rec-${r.num}">
      <summary>Recital ${r.num}</summary>
      <div class="lib-doc-body">${r.html}</div>
    </details>`).join('');
  return `
    <div class="block-head"><span class="block-num">§</span><h2>${L.libOmnibus}</h2></div>
    <div class="lib-note">${L.omnibusNote}</div>
    <div class="block-desc">${state.lang==='it'?'Articoli':'Articles'}</div>
    <div class="lib-accordion">${artItems}</div>
    <div class="block-desc" style="margin-top:24px;">${state.lang==='it'?'Considerando':'Recitals'}</div>
    <div class="lib-accordion">${recItems}</div>`;
}

function renderLibrary(){
  renderLibrarySidebar();
  const root = document.getElementById('libraryMain');
  if(state.libSection==='recitals') root.innerHTML = renderRecitalsView();
  else if(state.libSection==='articles') root.innerHTML = renderArticleView();
  else if(state.libSection==='annexes') root.innerHTML = renderAnnexesView();
  else if(state.libSection==='omnibus') root.innerHTML = renderOmnibusView();
  else { state.libSection='recitals'; root.innerHTML = renderRecitalsView(); }
  bindLibraryNav();
}

/* ============================= INIT & EVENTS ============================= */
document.getElementById('btnIT').addEventListener('click', ()=> setLang('it'));
document.getElementById('btnEN').addEventListener('click', ()=> setLang('en'));
document.getElementById('btnGuide').addEventListener('click', ()=> setMode('guide'));
document.getElementById('btnLibrary').addEventListener('click', ()=> setMode('library'));

function setMode(mode){
  state.mode = mode;
  document.getElementById('guideShell').style.display = mode==='guide' ? 'flex' : 'none';
  document.getElementById('libraryShell').style.display = mode==='library' ? 'flex' : 'none';
  document.getElementById('btnGuide').classList.toggle('active', mode==='guide');
  document.getElementById('btnLibrary').classList.toggle('active', mode==='library');
  document.getElementById('searchInput').placeholder = mode==='library' ? UI[state.lang].searchLibPh : UI[state.lang].searchph;
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResultsPanel').classList.remove('show');
  document.getElementById('searchResultsPanel').innerHTML = '';
  document.getElementById('searchCount').textContent = '';
  // Each mode owns its own search term — switching modes never lets one
  // mode's stale query/filter state leak into the other.
  if(mode==='guide'){
    state.guideQuery = '';
    applySearch();
  } else {
    state.libQuery = '';
  }
  if(mode==='library' && typeof renderLibrary==='function') renderLibrary();
}

function setLang(lang){
  state.lang = lang;
  document.documentElement.lang = lang;
  document.getElementById('btnIT').classList.toggle('active', lang==='it');
  document.getElementById('btnEN').classList.toggle('active', lang==='en');
  document.getElementById('btnGuide').textContent = UI[lang].modeGuide;
  document.getElementById('btnLibrary').textContent = UI[lang].modeLibrary;
  document.getElementById('searchInput').placeholder = state.mode==='library' ? UI[lang].searchLibPh : UI[lang].searchph;
  renderSidebar();
  renderMain(); // uses state.guideQuery only — never affected by a library search
  renderFooter();
  document.getElementById('searchInput').value = state.mode==='library' ? state.libQuery : state.guideQuery;
  if(state.mode==='library' && typeof renderLibrary==='function'){
    renderLibrary();
    applyLibrarySearch(); // rebuild results/highlighting against the new language's index
  }
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  if(state.mode==='library'){ state.libQuery = e.target.value; applyLibrarySearch(); }
  else { state.guideQuery = e.target.value; applySearch(); }
});

setLang('it');
</script>
